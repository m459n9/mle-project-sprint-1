# Пайплайн: выгрузка данных из БД -> разбиение -> обучение -> оценка.
# Все команды запускаются из папки part2_dvc, рядом лежит params.yaml.
stages:
  # 1. забираем очищенный датасет clean_flats_dataset из личной БД
  get_data:
    cmd: python scripts/data.py
    deps: [scripts/data.py]
    outs: [data/initial_data.csv]
  # 2. делим данные на train и test
  split_data:
    cmd: python scripts/split.py
    deps: [scripts/split.py, data/initial_data.csv]
    params: [index_col, test_size, random_state]
    outs: [data/train.csv, data/test.csv]
  # 3. обучаем модель на train
  fit_model:
    cmd: python scripts/fit.py
    deps: [scripts/fit.py, data/train.csv]
    params: [target_col, drop_cols, cat_cols, one_hot_drop, random_state, model]
    outs: [models/fitted_model.pkl]
  # 4. считаем метрики: кросс-валидация на train и проверка на test
  evaluate_model:
    cmd: python scripts/evaluate.py
    deps: [scripts/evaluate.py, models/fitted_model.pkl, data/train.csv, data/test.csv]
    params: [target_col, drop_cols, cat_cols, n_splits, n_jobs, metrics, random_state]
    metrics:
      - cv_results/cv_res.json:
          cache: false
